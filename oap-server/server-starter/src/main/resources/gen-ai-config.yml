# This file is used to configure the GenAI provider matching rules and estimated pricing.
# The rules define how to map model names to providers and calculate token costs.
#
# - provider: Required. The unique name of the AI service provider.
# - base-url: Optional. The entry point for the provider's API.
# - prefix-match: Required. A list of model name prefixes used to identify the provider.
#
# Pricing Configuration (specifically for Ollama or cost estimation):
# - input-price-per-m: Optional. The cost for 1,000,000 (one million) input tokens.
# - output-price-per-m: Optional. The cost for 1,000,000 (one million) output tokens.
# - models: Optional. A list of specific model overrides for granular pricing.
#   - name: The model name prefix to match (e.g., "llama3").
#   - input-price-per-m: Price per 1M input tokens for this specific model.
#   - output-price-per-m: Price per 1M output tokens for this specific model.

# Example for Ollama with per-million token pricing
#  - provider: ollama
#    prefix-match:
#      - ollama
#    models:
#      - name: ollama
#        input-cost-per-m: 1
#        output-cost-per-m: 1

providers:
  - provider: openai
    base-url: https://api.openai.com/v1
    prefix-match:
      - gpt
    models:
      - name: gpt-4.1-2025-04-14
        input-cost-per-m: 100
        output-cost-per-m: 100

  - provider: anthropic
    prefix-match:
      - claude

  - provider: bytedance
    prefix-match:
      - doubao

  - provider: zhipu_ai
    prefix-match:
      - glm

  - provider: alibaba
    prefix-match:
      - qwen

  - provider: gemini
    prefix-match:
      - gemini

  - provider: deepseek
    prefix-match:
      - deepseek

  - provider: ollama
    prefix-match:
      - ollama
    models:
      - name: ollama
        input-cost-per-m: 1
        output-cost-per-m: 1

