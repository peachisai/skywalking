version: "3"

services:
  oap:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: oap
    ports:
      - "12800:12800"
    networks:
      - e2e

  banyandb:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: banyandb
    ports:
      - 17912

  provider:
    extends:
      file: ../../script/docker-compose/base-compose.yml
      service: provider
    ports:
      - 9090
    depends_on:
      oap:
        condition: service_healthy

  spring-ai-examples:
    build:
      context: .
      dockerfile: Dockerfile.provider
      args:
        - SW_AGENT_JDK_VERSION=17
        - SW_AGENT_JAVA_COMMIT=${SW_AGENT_JAVA_COMMIT}
    networks:
      - e2e
    ports:
      - 9091
    environment:
      OPENAI_API_KEY: xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx
      SPRING_AI_OPENAI_BASE_URL: http://localhost:9090/llm
    depends_on:
      provider:
        condition: service_healthy

networks:
  e2e: